name: test
description: Check the package integrity via unittest.

runs:
  using: "composite"
  steps:
    - name: Test with pytest
      env:
        BRANCH: ${{ github.ref_name }}
      id: pytest
      continue-on-error: true
      run: |
        python -m pip install pytest pytest-html pytest-cov
        pushd src
        python -m pytest ../test/dummy --cov=. --cov-report xml
        popd
      shell: bash

    - name: Send Coverage Report to qlty.cloud
      uses: qltysh/qlty-action/coverage@v1
      with:
        token: ${{ env.QLTY_COVERAGE_TOKEN }}
        files: src/coverage.xml
        add-prefix: src/

    - name: Notice Error
      if: ${{ steps.pytest.outcome == 'failure' }}
      run: exit 1
      shell: bash
